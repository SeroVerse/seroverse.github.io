[project]
site_name = "SeroVerse"
site_description = "Landing page _in silico_ serotyping"
site_url = "https://seroverse.github.io"
site_author = "Tom Stanton"
repo_url = "https://github.com/SeroVerse/seroverse.github.io"
repo_name = "SeroVerse/seroverse.github.io"
edit_uri = "edit/master/docs/"
copyright = """
Copyright &copy; 2026 <a href="https://tomdstanton.com" target="_blank">Tom Stanton</a>
"""
docs_dir = "docs"
site_dir = "site"
watch = ["src"]
nav = [
    { Home = "index.md" },
]
plugins = [
    "search",
    { reading-time = { words_per_minute = 200 } },
    "include-markdown",
    "offline",
]

[project.theme]
# name = "material"
# logo = "assets/logo.png"
# favicon = "assets/favicon.png"
custom_dir = "docs/overrides"
language = "en"
icon.repo = "fontawesome/brands/github"
palette = [
    { media = "(prefers-color-scheme)", toggle = { icon = "lucide/sun-moon", name = "Switch to light mode" } },
    { media = "(prefers-color-scheme: light)", scheme = "default", toggle = { icon = "lucide/sun", name = "Switch to dark mode" } },
    { media = "(prefers-color-scheme: dark)", scheme = "slate", toggle = { icon = "lucide/moon", name = "Switch to system preference" } }
]
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "header.autohide",
    "navigation.top",
    "navigation.footer",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.tracking",
    "navigation.sections",
    "navigation.expand",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.path",
    "search.suggest",
    "search.highlight",
    "search.share",
    "toc.follow",
    # "toc.integrate",
]

# [project.extra]
# social = [
#     { icon = "lucide/mail", link = "mailto:kaptive.typing@gmail.com" },
#     { icon = "simple/pypi", link = "https://pypi.org/project/kaptive" },
#     { icon = "simple/anaconda", link = "https://anaconda.org/bioconda/kaptive" },
#     { icon = "lucide/book-open-text", link = "https://klebgenomics.github.io/Kaptive" },
#     { icon = "lucide/globe", link = "https://kaptive-web.erc.monash.edu/" },
# ]
# generator = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true, title = "On this page" }

"pymdownx.arithmatex" = { generic = true }
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
"pymdownx.highlight" = { anchor_linenums = true, use_pygments = true, linenums = true, auto_title = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = { base_path = ["."] }
"pymdownx.superfences" = { custom_fences = [ { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } ] }
"pymdownx.tabbed" = { alternate_style = true }

"zensical.extensions.glightbox" = {}
