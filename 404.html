<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to SeroVerse…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://seroverse.github.io/SeroVerse/" />
  <meta http-equiv="refresh" content="0; url=https://seroverse.github.io/SeroVerse/" />
  <script>
    (function () {
      var path = window.location.pathname.replace(/^\/+/, "");
      var target = "https://seroverse.github.io/SeroVerse/" +
        path +
        window.location.search +
        window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://seroverse.github.io/SeroVerse/">https://seroverse.github.io/SeroVerse/</a>…</p>
</body>
</html>
